networks:
  splunknet:
    driver: bridge
    attachable: true

services:
  rsbuild:
    image: splunk/splunk:10.4.2
    hostname: rsbuild
    working_dir: /app
    environment:
      - "PNPM_HOME=/app/node_modules/"
      - "PNPM_STORE_PATH=/app/node_modules/.pnpm-store"
    entrypoint: []
    user: root
    # This service reuses the Splunk image only to get Splunk's Python; it does not run
    # splunkd, so the image's inherited healthcheck would always report unhealthy.
    healthcheck:
      disable: true
    command:
      - bash
      - -c
      - >
        microdnf install -y libatomic &&
        chown -R splunk:splunk dist node_modules &&
        sudo -u splunk PNPM_STORE_PATH="$$PNPM_STORE_PATH" bash -c "
          curl -fsSL https://get.pnpm.io/install.sh | sh - &&
          export SPLUNK_HOME=/opt/splunk &&
          export PATH=/home/splunk/.local/share/pnpm/bin:/home/splunk/.local/share/pnpm:/opt/splunk/bin:$$PATH &&
          export LD_LIBRARY_PATH=/opt/splunk/opt/jemalloc-4k-nostats/lib:/opt/splunk/lib &&
          cd /app &&
          set -x &&
          pnpm env use --global lts &&
          pnpm install --store-dir \$$PNPM_STORE_PATH &&
          pnpm run dev
        "
    ports:
      - 3001:3000
    volumes:
      - ./:/app
      - splunk-app-dist:/app/dist
      - pnpm-node-modules:/app/node_modules

  splunkdev-10-0:
    image: splunk/splunk:10.0
    hostname: splunk
    environment:
      - "SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com"
      - "SPLUNK_START_ARGS=--accept-license"
      - "SPLUNK_PASSWORD=Temp1234!"
    ports:
      - 8000:8000
      # - 8089:8089
    volumes:
      - splunk-etc-10-0:/opt/splunk/etc
      # This path's last segment MUST match `splunkApp.appId` in package.json.
      - splunk-app-dist:/opt/splunk/etc/apps/my_splunk_app
      - splunk-app-local-10-0:/opt/splunk/etc/apps/my_splunk_app/local
      # Uncomment out the following line to use a custom Splunk license instead of a trial
      # - ./.dev/splunk.lic:/opt/splunk/etc/licenses/enterprise/splunk.lic

  splunkdev-10-2:
    image: splunk/splunk:10.2
    hostname: splunk
    environment:
      - "SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com"
      - "SPLUNK_START_ARGS=--accept-license"
      - "SPLUNK_PASSWORD=Temp1234!"
    ports:
      - 8002:8000
      # - 8089:8089
    volumes:
      - splunk-etc-10-2:/opt/splunk/etc
      # This path's last segment MUST match `splunkApp.appId` in package.json.
      - splunk-app-dist:/opt/splunk/etc/apps/my_splunk_app
      - splunk-app-local-10-2:/opt/splunk/etc/apps/my_splunk_app/local
      # Uncomment out the following line to use a custom Splunk license instead of a trial
      # - ./.dev/splunk.lic:/opt/splunk/etc/licenses/enterprise/splunk.lic

  splunkdev-10-4:
    image: splunk/splunk:10.4
    hostname: splunk
    environment:
      - "SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com"
      - "SPLUNK_START_ARGS=--accept-license"
      - "SPLUNK_PASSWORD=Temp1234!"
    ports:
      - 8004:8000
      # - 8089:8089
    volumes:
      - splunk-etc-10-4:/opt/splunk/etc
      # This path's last segment MUST match `splunkApp.appId` in package.json.
      - splunk-app-dist:/opt/splunk/etc/apps/my_splunk_app
      - splunk-app-local-10-4:/opt/splunk/etc/apps/my_splunk_app/local
      # Uncomment out the following line to use a custom Splunk license instead of a trial
      # - ./.dev/splunk.lic:/opt/splunk/etc/licenses/enterprise/splunk.lic

volumes:
  splunk-app-dist: {}
  pnpm-node-modules: {}
  splunk-etc-10-0: {}
  splunk-app-local-10-0: {}
  splunk-etc-10-2: {}
  splunk-app-local-10-2: {}
  splunk-etc-10-4: {}
  splunk-app-local-10-4: {}
