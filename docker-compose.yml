  #   command:
  #     - bash
  #     - -c
  #     - >
  #       groupmod -g 41812 node &&
  #       usermod -u 41812 -g 41812 node &&
  #       npm install -g pnpm@latest-10 &&
  #       chown -R 41812:41812 dist node_modules &&
  #       su - node -c "
  #         cd /app &&
  #         set -x &&
  #         pnpm install --store-dir $$PNPM_STORE_PATH &&
  #         pnpm run dev
  #       "
  #   ports:
  #     - 3001:3000
