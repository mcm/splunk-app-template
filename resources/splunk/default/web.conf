# Exposes the ASGI app's routes through splunkd's REST layer.
#
# `pattern` must cover every route your ASGI app defines. A wildcard is used here so
# that adding a route in Python needs no corresponding change in this file — matching
# the "your app is a normal web project" goal. Narrow it if you want an explicit allowlist.
#
# `methods` must include every verb your routes accept; omitted verbs return 405 before
# the request ever reaches Python.
[expose:splunk_react18_asgi_example]
pattern = splunk_react18_asgi_example/*
methods = GET,POST,PUT,PATCH,DELETE
